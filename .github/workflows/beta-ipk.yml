name: Beta IPK

on:
  push:
    branches: ["codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-ipk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ndk
        uses: ./.github/actions/webos-ndk
      - name: Nightly with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: beta-package
      - name: Restore the bundled FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/ffmpeg-prefix
          key: ffmpeg-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/build-ffmpeg.sh', 'ci/dependencies.json', 'ci/arm-cc.py') }}
      - name: Build Beta IPK and record its identity
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
        run: |
          set -euo pipefail
          make RELEASE=1 FLAVOR=beta WEBOS_SDK="$WEBOS_SDK" ipk

          ipks=(build/*.ipk)
          if [[ ${#ipks[@]} -ne 1 || ! -f "${ipks[0]}" ]]; then
            echo "::error::Expected exactly one IPK in build/"
            exit 1
          fi
          ipk="${ipks[0]}"
          app_id=$(make --no-print-directory -s RELEASE=1 FLAVOR=beta WEBOS_SDK="$WEBOS_SDK" print-appid)
          prefix="${app_id}_"
          filename="${ipk##*/}"
          [[ "$filename" == "${prefix}"*"_arm.ipk" ]] || { echo "::error::Unexpected IPK name: $filename"; exit 1; }
          package_version="${filename#"$prefix"}"
          package_version="${package_version%_arm.ipk}"
          base_version=$(python3 -c 'import json; print(json.load(open("pkg/appinfo.json"))["version"])')
          sha256=$(sha256sum "$ipk" | awk '{print $1}')
          printf '%s\n' "$sha256" > "$ipk.sha256"
          cat > build/BETA-BUILD.txt <<EOF
          commit=$GITHUB_SHA
          branch=$GITHUB_REF_NAME
          flavor=beta
          app_id=$app_id
          base_version=$base_version
          package_version=$package_version
          sha256=$sha256
          EOF
          {
            echo "### Beta IPK"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Package version: `$package_version`"
            echo "- SHA-256: `$sha256`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stremionative-beta-${{ github.sha }}
          path: |
            build/*.ipk
            build/*.ipk.sha256
            build/BETA-BUILD.txt
          if-no-files-found: error
          compression-level: 0
