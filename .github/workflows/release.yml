# Releases are cut by pushing a version tag on main:
#
#   git tag -a v0.2.0 -m "StremioNative 0.2.0" && git push origin v0.2.0
#
# The tag must equal pkg/appinfo.json's "version" (with a leading v). A tag with a suffix
# (v0.2.0-beta.1) publishes a PRERELEASE built as the separate "StremioNative Beta" app
# (FLAVOR=beta: its own app id, version X.Y.YYMMDDHHm: the UTC cut time, to ten minutes).
# webOS versions are numeric, so the cut time is what orders betas: one per ten minutes.
#
# A release no longer refreshes the Homebrew Channel repository (hbrepo.yml): run that workflow by
# hand on main when it should list the newest releases.
name: Release

on:
  push:
    tags: ["v*"]
  # The same release without pushing a tag first: run it on main with the tag to create, and the
  # publish step creates that tag at the commit this run built and tested.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.2.0 or v0.2.0-beta.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag names the packaged version
        id: v
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*) ;; *) echo "::error::$TAG is not a vX.Y.Z tag"; exit 1 ;; esac
          case "$TAG" in
            *-*) echo "::error::Beta publication must use the tested-artifact workflow; this workflow rebuilds packages"; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; push it to release it, or pick a new tag"
            exit 1
          fi
          tag="${TAG#v}"
          app=$(python3 -c 'import json;print(json.load(open("pkg/appinfo.json"))["version"])')
          base="${tag%%-*}"
          if [ "$base" != "$app" ]; then
            echo "::error::tag v$tag does not match pkg/appinfo.json version $app"
            exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "$base" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: The tag is on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libsdl2-dev libsdl2-ttf-dev libgl-dev
      - name: Tests
        run: SNATIVE_RUNTIME_DIR=$(mktemp -d) cargo test --workspace --no-fail-fast

  build:
    needs: verify
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ndk
        uses: ./.github/actions/webos-ndk
      - name: Nightly with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Build the package
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
        run: |
          set -euo pipefail
          flavor=stable
          if [ "${{ needs.verify.outputs.prerelease }}" = true ]; then flavor=beta; fi
          make RELEASE=1 FLAVOR="$flavor" WEBOS_SDK="$WEBOS_SDK" ipk
          ipk=$(ls build/*.ipk)
          test "$(echo "$ipk" | wc -l)" = 1
          sha256sum "$ipk" | awk '{print $1}' > "$ipk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipk
          path: |
            build/*.ipk
            build/*.ipk.sha256
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ipk
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: StremioNative ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.ipk
            dist/*.ipk.sha256
          fail_on_unmatched_files: true
